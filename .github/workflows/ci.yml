name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, typecheck, test and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The gate list lives in the root package.json `check` script, so CI and local
      # runs can't drift. pnpm prints a `$ <command>` line before each gate (oxlint,
      # build, typecheck, test, size-limit), so the log shows which one failed.
      - name: Quality gates (pnpm check)
        run: pnpm check
